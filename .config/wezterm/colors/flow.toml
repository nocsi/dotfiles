# Flow colorscheme | Alacritty
# https://github.com/0xstepit/flow.nvim

# Black and white
[colors]
background = '#1b2228'
foreground = '#b3c1cc'
cursor_bg = "#000000"
cursor_border = "#000000"
cursor_fg = "#ffffff"
selection_bg = "#c7ddfc"
selection_fg = "#000000"

ansi = ["#000000","#b9311b","#429429","#96942d","#081b90","#8a2e90","#419295","#c7c7c7"]
brights = ["#686868","#ed776d","#70c562","#c8c663","#5359c1","#bb63c3","#6fc4c7","#fafafa"]

# Normal colors
[colors.normal]
black = '#0d0d0d'
red = '#d98c93'
green = '#93d98c'
yellow = '#d9d28c'
blue = '#8cb9d9'
magenta = '#ac8cd9'
cyan = '#8cd9d2'
white = '#f2f2f2'

# Bright colors
[colors.bright]
black = '#0d0d0d'
red = '#d98c93'
green = '#93d98c'
yellow = '#d9d28c'
blue = '#8cb9d9'
magenta = '#ac8cd9'
cyan = '#8cd9d2'
white = '#f2f2f2'

# Search colors
[colors.search.matches]
foreground = '#ff007b'
background = '#0d0d0d'

[colors.search.focused_match]
foreground = '#0d0d0d'
background = '#ff007b'

# Selection colors
[colors.selection]
background = '#ff007b'
text = '#0d0d0d'

# Cursors
# If you don't want to override original behavior, which is nice,
# remove [colors.cursor] and [colors.vi_mode_cursor].
[colors.cursor]
cursor = '#ff007b'
text = '#0d0d0d'

[colors.vi_mode_cursor]
cursor = '#ff007b'
text = '#0d0d0d'

[colors.footer_bar]
foreground = '#ff007b'
background = '#0d0d0d'

# Purple color
[[colors.indexed_colors]]
index = 93
color = '#ac8cd9'

# Fluo Colors
[[colors.indexed_colors]]
index = 198
color = '#ff007b'
