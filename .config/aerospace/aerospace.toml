]

[mode.service.binding]
esc = [
  'reload-config',
  'exec-and-forget sketchybar --trigger hide_message',
  'exec-and-forget sketchybar --reload',
  'mode main',
]
ctrl-alt-cmd-r = ['flatten-workspace-tree', 'mode main'] # reset layout
#s = ['layout sticky tiling', 'mode main'] # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2


b = [
  'exec-and-forget ~/.config/aerospace/presentation.sh on',
  'exec-and-forget sketchybar --bar height=0',
  'exec-and-forget sketchybar --trigger hide_message',
  'mode main',
]
shift-b = [
  'exec-and-forget ~/.config/aerospace/presentation.sh off',
  'exec-and-forget sketchybar --bar height=36',
  'exec-and-forget sketchybar --trigger hide_message',
  'mode main',
]

backspace = ['close-all-windows-but-current', 'mode main']

[mode.resize.binding]
ctrl-alt-cmd-space = ['mode binding']
space = ['mode main', 'exec-and-forget sketchybar --trigger hide_message']
esc = ['mode alt', 'exec-and-forget sketchybar --trigger hide_message']
r = ['mode alt', 'exec-and-forget sketchybar --trigger hide_message']
# space = 'mode main'
# esc = 'mode alt'
# r = 'mode alt'
keypadMinus = 'resize smart -64'
keypadPlus = 'resize smart +64'
h = ['resize width -64']
j = ['resize height -64']
k = ['resize height +64']
l = ['resize width +64']
shift-h = ['resize width -8']
shift-j = ['resize height -8']
shift-k = ['resize height +8']
shift-l = ['resize width +8']

[mode.spacial.binding]
