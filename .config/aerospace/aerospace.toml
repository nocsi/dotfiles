# AEROSPACE CONFIG
start-at-login = true

after-login-command = []

after-startup-command = [
  'exec-and-forget sketchybar >> $HOME/.sketchybar/service.log 2>&1',
  'exec-and-forget borders active_color=0xffc6a0f6 inactive_color=0xff939ab7 width=6.0 hidpi=on', # requires https://github.com/FelixKratz/JankyBorders
  #     'exec-and-forget /opt/homebrew/opt/sketchybar/bin/sketchybar'
]

exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'sketchybar --trigger aerospace_workspace_changed FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

on-focus-changed = [
  'move-mouse window-lazy-center',
  'exec-and-forget /bin/bash -c /opt/homebrew/bin/sketchybar --trigger front_app_switched',
  'exec-and-forget sketchybar --trigger update_windows',
]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 8

default-root-container-layout = 'tiles'

default-root-container-orientation = 'auto'

key-mapping.preset = 'qwerty'
# [key-mapping.key-notation-to-key-code]
# hyper = 'ctrl+alt+cmd'

[gaps]
# Allow for more space on smaller screens
inner.horizontal = [{ monitor."Built-in Retina Display" = 10 }, 15]
inner.vertical = [{ monitor."Built-in Retina Display" = 10 }, 25]
outer.left = [{ monitor."Built-in Retina Display" = 5 }, 30]
outer.bottom = [{ monitor."Built-in Retina Display" = 5 }, 10]
outer.top = [{ monitor."Built-in Retina Display" = 5 }, 50]
outer.right = [{ monitor."Built-in Retina Display" = 5 }, 30]

[exec] # Again, you don't need to copy all config sections to your config.
inherit-env-vars = true # If you don't touch "exec" section,
[exec.env-vars] # it will fallback to "default-config.toml"
PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:${PATH}'

[mode.main.binding]
ctrl-alt-cmd-space = ['mode alt']

ctrl-alt-cmd-slash = 'layout tiles horizontal vertical'
ctrl-alt-cmd-comma = 'layout accordion horizontal vertical'
ctrl-alt-cmd-shift-space = 'layout floating tiling'
ctrl-alt-cmd-r = [
  'mode resize',
  'exec-and-forget sketchybar --trigger send_message MESSAGE="RESIZE MODE" HOLD="true"',
]
ctrl-alt-cmd-semicolon = 'mode spacial'
ctrl-alt-cmd-w = 'mode workspace'

ctrl-alt-cmd-keypadMinus = 'resize smart -70'
ctrl-alt-cmd-keypadPlus = 'resize smart +70'


ctrl-alt-cmd-h = [
  'focus --boundaries all-monitors-outer-frame --boundaries-action stop left',
  'move-mouse window-force-center',
]
ctrl-alt-cmd-j = [
  'focus --boundaries all-monitors-outer-frame --boundaries-action stop down',
  'move-mouse window-force-center',
]
ctrl-alt-cmd-k = [
  'focus --boundaries all-monitors-outer-frame --boundaries-action stop up',
  'move-mouse window-force-center',
]
ctrl-alt-cmd-l = [
  'focus --boundaries all-monitors-outer-frame --boundaries-action stop right',
  'move-mouse window-force-center',
]

ctrl-alt-cmd-1 = 'workspace --auto-back-and-forth 1'  # Notes
ctrl-alt-cmd-2 = 'workspace --auto-back-and-forth 2'  # Terminal
ctrl-alt-cmd-3 = 'workspace --auto-back-and-forth 3'  # Browser
ctrl-alt-cmd-4 = 'workspace --auto-back-and-forth 4'  # AltBrowser
ctrl-alt-cmd-5 = 'workspace --auto-back-and-forth 5'  # Remote
ctrl-alt-cmd-6 = 'workspace --auto-back-and-forth 6'  # Database
ctrl-alt-cmd-7 = 'workspace --auto-back-and-forth 7'  # Chat
ctrl-alt-cmd-8 = 'workspace --auto-back-and-forth 8'  # Mail
ctrl-alt-cmd-9 = 'workspace --auto-back-and-forth 9'  # Music
ctrl-alt-cmd-0 = 'workspace --auto-back-and-forth 10' # Secrets
ctrl-alt-cmd-u = 'workspace prev'
ctrl-alt-cmd-i = 'workspace next'


# cmd-q = ['close --quit-if-last-window']
# cmd-w = []

# 'alt' binding mode declaration
[mode.alt.binding]
# ctrl-alt-cmd-space = ['mode alt']
space = ['mode main']
esc = ['mode alt']
backtick = ['reload-config', 'mode main']

# You can uncomment this line to open up terminal with alt + enter shortcut
# See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
# alt-enter = 'exec-and-forget open -n /System/Applications/Utilities/Terminal.app'

# See: https://nikitabobko.github.io/AeroSpace/commands#layout

slash = 'layout tiles horizontal vertical'
comma = 'layout accordion horizontal vertical'


# See: https://nikitabobko.github.io/AeroSpace/commands#focus
h = ['focus --boundaries-action stop left', 'move-mouse window-force-center']
j = ['focus --boundaries-action stop down', 'move-mouse window-force-center']
k = ['focus --boundaries-action stop up', 'move-mouse window-force-center']
l = ['focus --boundaries-action stop right', 'move-mouse window-force-center']

c = ['move-mouse window-force-center']

# See: https://nikitabobko.github.io/AeroSpace/commands#move
shift-h = 'move left'
shift-j = 'move down'
shift-k = 'move up'
shift-l = 'move right'

# See: https://nikitabobko.github.io/AeroSpace/commands#resize
minus = 'resize smart -64'
equal = 'resize smart +64'
shift-minus = 'resize smart -128'
shift-equal = 'resize smart +128'

# reset layout
# shift-r = ['flatten-workspace-tree', 'mode alt'] # reset layout

# Fullscreen is under 'm' for "Maximize"
m = ['fullscreen']

# No more toggling for these commands
# f = ['layout floating']
# t = ['layout tiling']


# See: https://nikitabobko.github.io/AeroSpace/commands#workspace
u = 'workspace prev'
i = 'workspace next'
shift-u = 'move-node-to-workspace prev'
shift-i = 'move-node-to-workspace next'
1 = 'workspace 1'
2 = 'workspace 2'
3 = 'workspace 3'
4 = 'workspace 4'
5 = 'workspace 5'
6 = 'workspace 6'
7 = 'workspace 7'
8 = 'workspace 8'
9 = 'workspace 9'
0 = 'workspace 10'
p = ['focus-monitor prev', 'move-mouse window-force-center']
n = ['focus-monitor next', 'move-mouse window-force-center']
shift-p = 'move-workspace-to-monitor prev'
shift-n = 'move-workspace-to-monitor next'

# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
shift-1 = 'move-node-to-workspace 1'
shift-2 = 'move-node-to-workspace 2'
shift-3 = 'move-node-to-workspace 3'
shift-4 = 'move-node-to-workspace 4'
shift-5 = 'move-node-to-workspace 5'
shift-6 = 'move-node-to-workspace 6'
